name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: markdown
    attributes:
      value: |
        Note: features that give treatment advice (e.g. insulin dosing) are out of scope. New clinical metrics should cite their source.
